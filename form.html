<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>報名測試</title>
<style>
  .tpma-form-wrap {
    max-width: 900px;
    margin: 20px auto;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .tpma-field { margin-bottom: 14px; }
  .tpma-label-row {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
    gap: 6px;
  }
  .tpma-label { font-weight: 600; }
  .tpma-required {
    font-size: 11px;
    color: #d00;
    border: 1px solid #d00;
    padding: 0 4px;
    border-radius: 3px;
  }
  .tpma-input,
  .tpma-select,
  .tpma-textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    box-sizing: border-box;
    font-size: 14px;
  }
  .tpma-input-error {
    border-color: #d00 !important;
    background-color: #fff6f6;
  }
  .tpma-error-msg {
    margin-top: 2px;
    font-size: 11px;
    color: #d00;
  }
  .tpma-note {
    font-size: 12px;
    color: #666;
  }
  .tpma-inline-3 {
    display: flex;
    gap: 6px;
  }
  .tpma-inline-3 > div { flex: 1; }
  .tpma-btn {
    padding: 8px 16px;
    background: #0073aa;
    color: #fff;
    border-radius: 3px;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }
  .tpma-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
  }
  .tpma-btn-secondary {
    background: #555;
  }
  .tpma-summary-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .tpma-summary-modal {
    background: #fff;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 16px 18px;
    border-radius: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    font-size: 13px;
  }
  .tpma-summary-modal h3 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 600;
  }
  .tpma-summary-table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
  }
  .tpma-summary-table th,
  .tpma-summary-table td {
    border: 1px solid #ddd;
    padding: 4px 6px;
    vertical-align: top;
  }
  .tpma-summary-actions {
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .tpma-alert {
    margin-top: 10px;
    padding: 8px;
    border-radius: 3px;
    font-size: 13px;
  }
  .tpma-alert-success {
    background: #e6ffed;
    border: 1px solid #2c974b;
    color: #135724;
  }
  .tpma-alert-error {
    background: #ffecec;
    border: 1px solid #d00;
    color: #a30000;
  }
  .tpma-loading {
    font-size: 13px;
    color: #555;
    margin-bottom: 8px;
  }
  .tpma-learner {
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fafafa;
  }
  .tpma-learner-title {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .tpma-flex-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
</style>
</head>

<body>

<div id="tpma-course-registration">
  <div class="tpma-form-wrap">
    <div id="tpma-loading" class="tpma-loading">載入課程資料中...</div>
    <form id="tpma-reg-form" novalidate>
      <!-- 課程名稱 -->
      <div class="tpma-field">
        <div class="tpma-label-row">
          <div class="tpma-label">課程名稱</div>
          <div class="tpma-required">* 必填</div>
        </div>
        <select id="course-select" class="tpma-select">
          <option value="">請選擇課程</option>
        </select>
        <div class="tpma-error-msg" data-error-for="course-select"></div>
      </div>

      <!-- 授課日期 / 場次 -->
      <div class="tpma-field">
        <div class="tpma-label-row">
          <div class="tpma-label">授課日期 / 場次</div>
          <div class="tpma-required">* 必填</div>
        </div>
        <select id="session-select" class="tpma-select" disabled>
          <option value="">請先選擇課程</option>
        </select>
        <div class="tpma-error-msg" data-error-for="session-select"></div>
      </div>

      <!-- 課程資訊展示 -->
      <div class="tpma-field">
        <div class="tpma-label">講師</div>
        <p id="course-lecturer"></p>
      </div>

      <div class="tpma-field">
        <div class="tpma-label">課程名稱</div>
        <p id="course-name-display"></p>
      </div>

      <div class="tpma-field">
        <div class="tpma-label">簡介</div>
        <p id="course-intro"></p>
      </div>

      <div class="tpma-field">
        <div class="tpma-label">大綱</div>
        <div id="course-outline"></div>
      </div>

      <div class="tpma-field">
        <div class="tpma-label">授課時數（小時）</div>
        <p id="course-duration"></p>
      </div>

      <hr>

      <!-- 學員區塊 -->
      <div class="tpma-field">
        <div class="tpma-label-row">
          <div class="tpma-label">報名學員資料</div>
          <div class="tpma-required">* 至少 1 位學員，姓名與 Email 必填</div>
        </div>
      </div>

      <div id="learners-wrapper"></div>

      <div class="tpma-field">
        <button type="button" id="add-learner" class="tpma-btn tpma-btn-secondary">+ 新增一位學員</button>
        <div class="tpma-error-msg" data-error-for="learners"></div>
      </div>

      <!-- 承辦 / 公司 / 收據 / 收件人欄位已移至 Woo 結帳頁，表單不再收集 -->

      <!-- 資訊來源 -->
      <div class="tpma-field">
        <div class="tpma-label-row">
          <div class="tpma-label">資訊來源</div>
        </div>
        <select id="source" class="tpma-select">
          <option value="">請選擇</option>
          <option value="學會官網">學會官網</option>
          <option value="TWSE 官網">TWSE 官網</option>
          <option value="學會 Mail">學會 Mail</option>
          <option value="學會電訪">學會電訪</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <!-- 備註 -->
      <div class="tpma-field">
        <div class="tpma-label-row">
          <div class="tpma-label">備註</div>
        </div>
        <textarea id="note" class="tpma-textarea" rows="3"></textarea>
      </div>

      <button type="button" id="tpma-submit" class="tpma-btn">下一步</button>
      <div id="tpma-message"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const TPMA_API_BASE = 'https://mazuuni.org.tw/tw-pma/wp-json/tpma/v1';

let coursesMap = {};
let firstErrorElement = null;

// Helper function for HTML escaping
function esc(s) {
    return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(m){
        return {'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m];
    });
}

// ===== 工具 =====
function pad2(n){return n.toString().padStart(2,'0');}

function minutesToHoursString(mins){
  const m = parseInt(mins,10)||0;
  if(!m) return '';
  const h = m/60;
  return Number.isInteger(h) ? h + ' 小時' : (Math.round(h*10)/10) + ' 小時';
}

function formatSessionLabel(sessionDatetime, durationMinutes){
  if(!sessionDatetime) return '課程尚在安排中...';
  const start = new Date(sessionDatetime.replace(' ','T'));
  if(isNaN(start.getTime())) return sessionDatetime;
  const dur = parseInt(durationMinutes||0,10);
  const end = new Date(start.getTime() + dur*60000);
  const weekdayMap = ['日','一','二','三','四','五','六'];
  const y = start.getFullYear();
  const mo = pad2(start.getMonth()+1);
  const d = pad2(start.getDate());
  const w = weekdayMap[start.getDay()];
  const sh = pad2(start.getHours());
  const sm = pad2(start.getMinutes());
  const eh = pad2(end.getHours());
  const em = pad2(end.getMinutes());
  return `${y}-${mo}-${d}（${w}） ${sh}:${sm}~${eh}:${em}`;
}

function buildPhone(area, main, ext){
  const a = (area||'').replace(/\D/g,'');
  const m = (main||'').replace(/\D/g,'');
  const e = (ext||'').replace(/\D/g,'');
  if(!a || !m) return '';
  let fm = m;
  if(m.length===8) fm = m.slice(0,4)+'-'+m.slice(4);
  else if(m.length===7) fm = m.slice(0,3)+'-'+m.slice(3);
  let out = `(${a})${fm}`;
  if(e) out += `#${e}`;
  return out;
}

/ 單一欄位手機字串 → 格式化成 xxxx-xxx-xxx，錯誤回傳 null，空白回傳 ''
function buildMobile(rawVal){
  const digits = (rawVal || '').replace(/\D/g,'');
  if(!digits) return '';            // 全空：視為沒填
  if(digits.length !== 10) return null; // 長度錯誤：讓驗證丟錯
  return (
    digits.slice(0,4) + '-' +
    digits.slice(4,7) + '-' +
    digits.slice(7,10)
  );
}

// ===== 手機欄位處理 =====
function formatMobileInput(input){
  let v = input.value.replace(/\D/g,'');
  if(!v){
    input.value = '';
    return;
  }
  if(v.length > 10) v = v.slice(0,10);

  if(v.length === 10){
    input.value =
      v.slice(0,4) + '-' +
      v.slice(4,7) + '-' +
      v.slice(7,10);
  }else{
    // 長度不對就維持純數字，交給驗證處理
    input.value = v;
  }
}
	
function getQueryParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    ok,
    cid,
    sessionValue,
    sessionText,
    learners,
    shared: {
      source: document.getElementById("source").value,
      note: document.getElementById("note").value.trim()
    }
  };
}

// ===== Summary Modal：顯示多學員確認 =====
function showSummaryModal(courseInfo, form){
  const backdrop = document.createElement('div');
  backdrop.className = 'tpma-summary-modal-backdrop';
  const m = document.createElement('div');
  m.className = 'tpma-summary-modal';

  const sharedRows = `
    <tr><th>課程名稱</th><td>${courseInfo.course_name}</td></tr>
    <tr><th>授課日期 / 場次</th><td>${courseInfo.class_date || ''}</td></tr>
    <tr><th>講師</th><td>${courseInfo.lecturer || ''}</td></tr>
    <tr><th>資訊來源</th><td>${form.shared.source || ''}</td></tr>
    <tr><th>備註</th><td>${(form.shared.note || "").replace(/\n/g,"<br>")}</td></tr>
  `;

  const learnersRows = form.learners.map((l,idx)=>`
    <tr>
      <th>學員 ${idx+1}</th>
      <td>
        姓名：${l.name}<br>
        部門／職稱：${l.dept || ''}／${l.title || ''}<br>
        Email：${l.email}<br>
        行動電話：${l.mobile || ''}<br>
      </td>
    </tr>
  `).join('');

  m.innerHTML = `
    <h3>請確認以下報名資訊（共 ${form.learners.length} 位學員）</h3>
    <table class="tpma-summary-table">
      <tbody>
        ${sharedRows}
        ${learnersRows}
      </tbody>
    </table>
    <div class="tpma-summary-actions">
      <button type="button" class="tpma-btn tpma-cancel">返回修改</button>
      <button type="button" class="tpma-btn tpma-confirm">確認送出</button>
    </div>
  `;
  backdrop.appendChild(m);
  document.body.appendChild(backdrop);

  return new Promise(resolve=>{
    m.querySelector('.tpma-cancel').onclick = ()=>{document.body.removeChild(backdrop);resolve(false);};
    m.querySelector('.tpma-confirm').onclick = ()=>{document.body.removeChild(backdrop);resolve(true);};
  });
}

// ===== 送 Woo checkout init =====
async function submitMultipleRegistrations(courseInfo, form){
  const msgBox = document.getElementById('tpma-message');
  const btn = document.getElementById('tpma-submit');
  msgBox.innerHTML = '';
  btn.disabled = true;

  const payload = {
    course_id: parseInt(form.cid, 10),
    session_id: form.sessionValue || '',
    learners: form.learners.map(l => ({
      student_name: l.name,
      department: l.dept,
      job_title: l.title,
      mobile: l.mobile,
      emails: l.email
    })),
    source: form.shared.source,
    note: form.shared.note
  };

  try {
    const res = await fetch(`${TPMA_API_BASE}/checkout-init`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify(payload)
    });
    const data = await res.json().catch(()=>({}));

    if (!res.ok || !data.checkout_url) {
      throw new Error(data.message || data.code || '送出失敗，請稍後再試。');
    }

    window.location = data.checkout_url;

  } catch (e) {
    console.error(e);
    msgBox.innerHTML = `<div class="tpma-alert tpma-alert-error">${e.message}</div>`;
    btn.disabled = false;
    return;
  }
}

// ===== 綁定事件 =====
document.getElementById('course-select').addEventListener('change', onCourseChange);

document.getElementById('add-learner').addEventListener('click', () => {
  addLearner();
});

document.getElementById('tpma-submit').addEventListener('click', async () => {
  const v = validateForm();
  if(!v.ok) return;

  const c = coursesMap[v.cid];
  const courseInfo = {
    course_name: c?.course_name || '',
    lecturer: c?.lecturer || '',
    class_date: v.sessionText || ''
  };

  const confirmed = await showSummaryModal(courseInfo, v);
  if(!confirmed) return;

  await submitMultipleRegistrations(courseInfo, v);
});

// 初始：建立第一位學員區塊 & 載入課程
addLearner();
loadCourses();

//同步測試003

</script>



</body>
</html>
